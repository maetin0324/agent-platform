# クラスタでコマンドを実行する設定の例（ADR-0018、Phase 12）。相対パスはこのファイルのあるディレクトリ基準。
#
# 前提:
#   - ワーカー（claude-code / codex）は **このホストで動く**。クラスタで実行するのは「コマンド」だけ。
#   - クラスタへの ssh は**人が張る**（2 要素認証）。taskd は ControlMaster の多重接続を借りるだけで、
#     対話的な認証は行わない。張り方: scripts/cluster-login.sh pegasus
#   - ~/.ssh/config に ControlMaster の設定が要る（config/ssh-config.example）。
#
# タスクの作り方:
#   taskctl add --title "benchfs のベンチ" --objective "..." \
#     --cluster pegasus --workspace /work/NBB/rmaeda/workspace/rust/benchfs \
#     --check-cmd "cargo test --release"
#   → クラスタ側の /work/.../benchfs が正で、taskd は workspaces/<task_id> に写しを作る。
#     run の前に pull、ワーカーが写しを編集、判定の前に push、`--check-cmd` はクラスタで実行される。
#
# 同期の選び方（ADR-0019 D4）:
#   worktree … 既定の選択。git 管理下のプロジェクト。クラスタ側に `git worktree` を切り、その中だけを同期する。
#              追跡ファイルしか checkout されないので、未追跡の巨大データ（benchfs は 263 GB のうち 220 GB が未追跡）を
#              持ち込まない。元のリポジトリの作業ツリーには一切触らない。変更はブランチ taskd/<task_id> の作業ツリーに残り、
#              commit / merge / 後片付け（git worktree remove）は人が行う。
#   rsync   … git 管理外の小さなディレクトリ、taskd 専用の作業ディレクトリ。
#   none    … 手元とクラスタでファイルシステムが共有されている場合。
#
# 動作確認と観測（Phase 12 第 2 段階）:
#   taskctl --db ../taskd.sqlite3 worker run --config taskd.toml --task <id> --cluster pegasus
#     → デーモン無しで 1 回 run（pull → run → push）。DB は変えない。多重接続が無ければ exit 4。
#   curl -s http://127.0.0.1:7710/api/v1/clusters     → 接続の有無（connected）と cooldown
#   curl -s http://127.0.0.1:7710/api/v1/inbox        → attention[] の type = "cluster_unavailable"（ログインし直しの案内）

db = "../taskd.sqlite3"
workspace_root = "../workspaces"
tick_ms = 2000
max_concurrency = 2

[api]
listen = "127.0.0.1:7710"

[adapters.claude_code]
permission_mode = "bypassPermissions"

[[providers]]
id = "claude-default"
adapter = "claude-code"
tiers = ["frontier", "standard", "cheap"]
concurrency = 2
model = "claude-sonnet-5"

[[clusters]]
id = "pegasus"
host = "pegasus"                  # ~/.ssh/config の Host 名
concurrency = 2                   # このクラスタで同時に走らせる run の上限
sync = "worktree"                 # git 管理下なら worktree（ADR-0019）。管理外なら "rsync"、共有 FS なら "none"
delete_on_push = false            # 既定 false。既存プロジェクトのファイルを消さない
# worktree_root = "/work/NBB/rmaeda/.taskd-worktrees"  # 既定は <project>/.taskd-worktrees
# worktree_base = "HEAD"          # 切り出す元。"origin/main" なども指定できる
# worktree_paths = ["src", "Cargo.toml", "lib/pluvio/src"]
#   ↑ sparse-checkout で残すパス。追跡ファイルにも巨大なものがある場合に使う
#     （benchfs は追跡 41 GB のうち 39 GB がベンチ結果。src だけなら 2.2 MB）。
# remove_worktree_when = "never"  # 既定 "never"。taskd は worktree を消さない（実行結果を失わないため）
# setup = ["module load python/3.12"]
# env = { OMP_NUM_THREADS = "8" }
# rsync_excludes = ["target/"]    # .taskd/ runs/ inputs/ は常に除外

[[clusters]]
id = "sirius"
host = "sirius"
concurrency = 2
sync = "worktree"
delete_on_push = false
