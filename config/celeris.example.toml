# celeris 設定の例（ADR-0005 D7）。相対パスはこのファイルのあるディレクトリ基準。
#
# 本番の置き場（ADR-0045 D2。XDG 流）:
#   ~/.config/celeris/  config.toml org.toml providers.d/ api.token gui.password gui.session-secret secrets/
#   ~/.local/celeris/   celeris.sqlite3 releases/ backups/ staging/ workspaces/ memory/ logs/
#                       claude-accounts/ codex-accounts/ containers/ tools/
# **省略したときの既定**（`~` は celeris の $HOME で展開する）:
#   db = "~/.local/celeris/celeris.sqlite3"          workspace_root = "~/.local/celeris/workspaces"
#   [selfdeploy] releases_dir = "~/.local/celeris/releases"   [memory] dir = "~/.local/celeris/memory"
#   [containers] build_dir = "~/.local/celeris/containers"    [secrets] dir = "~/.config/celeris/secrets"
# `[api] token_file` と `[accounts] claude_dir` / `codex_dir` には既定を入れない（書いていないこと自体が
# 「認証を使わない」「そのプールを設定していない」という意味を持つ）。本番は
# `~/.config/celeris/api.token` と `~/.local/celeris/{claude,codex}-accounts` に置く。
db = "../celeris.sqlite3"            # celerisctl --db / CELERIS_DB と同じファイルを指すこと
# タスクの足回り（worktree・成果物・run のログ）の置き場（ADR-0042 D3）。
# **書かなければ既定は `~/.local/celeris/workspaces`**（`~` は celeris の `$HOME` で展開する）。
# 相対パスを書いたときだけ、この設定ファイルのあるディレクトリ基準になる（Phase 51 までの挙動）。
workspace_root = "../workspaces"   # WorkspaceSpec::Local の相対パスの基準でもある
tick_ms = 2000
max_concurrency = 2
lease_grace_secs = 60              # ADR-0002 D7: リース ttl = max_wall_secs + 猶予
idle_timeout_secs = 300            # ADR-0003 D4: 無出力タイムアウト
kill_grace_secs = 10               # ADR-0003 D4 / ADR-0044 Phase 53 追記: run を止めるときに
                                   # ワーカーの**プロセスグループ**へ SIGTERM を送ってから SIGKILL までの猶予
                                   # （cancel・人のコメントによる割り込み・タイムアウト・リース喪失・drain 共通）
review_timeout_secs = 600          # Command チェック 1 件あたりの上限
error_cooldown_secs = 300          # AuthFailed / Exhausted / 起動失敗時のプロバイダ除外時間
retry_backoff_base_secs = 10       # ADR-0010 D6: リトライ前の待ち min(base·2^(attempts-1), max)。0 で無効
retry_backoff_max_secs = 300
max_requeues = 5                   # ADR-0011: 同じ試行での連続 requeue（供給側失敗）の上限。超えたら attempts を消費する

# 組織図の種（ADR-0033 D1、SPEC §3.2）。指したファイルの `[[org]]` を、**DB の `org_nodes` が空のときだけ**
# 蒔く。以後の編集は GUI（`POST/PATCH/DELETE /api/v1/org`）から行い、この設定は再読込されない。
# 書かなければ種を蒔かない（組織を使わない従来どおりの運用）。
# `config/org.example.toml` をこのファイルと同じディレクトリに `org.toml` として置けば、下の
# `[[harnesses]]`（coding / literature / …）とそのまま噛み合う（監査 M-1。不整合は起動時に弾かれる）。
# org_include = "org.toml"

# 組織のノードごとの長期記憶（ADR-0033 D6、SPEC §3.2「各ノードは長期記憶を持つ」「記憶は案件をまたぐ」）。
# `<dir>/<node_id>/notes.md`（案件をまたぐ記憶）と `<dir>/<node_id>/projects/<project_id>.md`（案件の引き出し）。
# run の前にそれぞれ 8,000 字まで前置きし、run の後に結果ファイル（`<artifacts_dir>/result.json`。
# 共有 workspace のタスクでは `.taskd/artifacts/<task_id>/result.json`。ADR-0036）の `memory` を
# `- <日付>: <一行>` の形で追記する。相対パスはこのファイル基準。書かなければ記憶を読まないし書かない。
# ディレクトリは 0700 で作る（人の好みや相談の中身が入るため）。
[memory]
dir = "../memory"

# タスクごと・リポジトリごとに git worktree を切る（ADR-0041 D1 / ADR-0043 D2、Phase 49 / 52）。
#
# 案件は「リポジトリ」を複数持つ（`project_repos`。GUI の案件画面「リポジトリ」で登録する）。
# タスクが使うリポジトリ（`Task.repos`。明示 > 親 > 案件の primary）は、それぞれ
#   <workspace_root>/<task_id>/repos/<name>/
# に置かれる。`kind = "git"` なら
#   git -C <実体> worktree add -b <worktree_branch_prefix><task_id> <その場所> <base>
# の worktree、`kind = "dir"` なら実体へのシンボリックリンク（コピーしない）。
# ワーカーのカレントディレクトリは **`repos[0]`**（`runs/` と `artifacts/` は作業ツリーの外）。
# base は `main`（無ければ `HEAD`）。本番の `current` リリースの sha が `main` の子孫ならその sha
# （`[selfdeploy] releases_dir` の親の `current/manifest.json` を読む）。
# celeris はコミットしない。**終端（done / failed）では worktree もブランチも消さない**（差分を見るために残す。
# ADR-0043 D2）。消えるのは**中止**（`POST /tasks/{id}/cancel`）のときだけで、worktree と `git branch -D`。
# リポジトリの `location` に `"mode": "shared"` と書けば worktree を切らず、実体へのリンクにする。
# リポジトリの中の設定（`[commands] setup` / `check`、`[outputs]`、`[run] mode`）は
# `<repo>/.config/celeris/workspace.toml`（ADR-0043 D4。`docs/workspace.md`）。
# 接頭辞の既定は **`celeris/`**（ADR-0042 D3。Phase 49 は `celeris/` だった。クラスタ側〈ADR-0019 の
# `[[clusters]] sync = "worktree"`〉は `celeris/` のまま）。
[workspace]
# worktree_branch_prefix = "celeris/"

# ADR-0066 D1（Phase 110b）: 同一リポジトリの worktree 間で cargo のビルドキャッシュを共有する。
# ローカルの git worktree のホスト実行（コンテナ・Remote は対象外）に
# `CARGO_TARGET_DIR=<build_cache_dir>/cargo/<repo-key>` を与える。既定で有効。
# shared_build_cache = true
# build_cache_dir = "~/.local/celeris/build-cache"

# ADR-0066 D2（Phase 110b）: 終端（done/failed/cancelled）になってからこの秒数経った作業場所から、
# ビルド生成物（`target/`、`node_modules/` 等）だけを刈る（ソースツリーと `artifacts/` は残す）。
# `0` で無効。既定 86400（24 時間）。`celerisctl workspace prune [--dry-run] [--older-than <secs>]` で
# 人が手で回すこともできる。
# prune_after_secs = 86400

# 新しい run の起動前に /、workspace_root、build_cache_dir の空きを確認する（MiB）。
# 0 で無効。不足中は通知を 1 回出して保留し、回復すると自動で再開する。
[dispatch]
# min_free_disk_mb = 5120

# 変更の取り込み（ADR-0043 D5、Phase 54）。タスクが作ったブランチを**人が** GUI から
# 「main に取り込む」「PR を作る」「捨てる」する（`GET/POST /api/v1/tasks/{id}/changes...`）。
# 押せるのは人だけで、組織の「人」＝ワーカーからこの経路には届かない（SPEC §3.6）。
#   gh           — GitHub CLI の場所。PATH にあれば既定の "gh" のままでよい。
#                  無い・認証されていない（`gh auth status` が失敗する）ときは PR の経路が 409 になり、
#                  「main に取り込む」（ローカルの rebase + fast-forward）だけが使える。
#                  結果はプロセス内で 60 秒だけ覚える（画面を開くたびに起こさない）。
#   merge_method — 「Celeris で merge」が使う方法（`gh pr merge --<method> --delete-branch`）。
#                  "merge"（既定）/ "squash" / "rebase" のどれか。他を書くと起動時の設定エラー。
# PR の状態の同期は**画面を開いたときだけ**（`gh pr view`。常時同期はしない。ADR-0043 D5）。
[github]
# gh = "gh"
# merge_method = "merge"

# コンテナ実行（ADR-0043 D3、Phase 56）。リポジトリの `run` が `container`（または `auto` で
# `<repo>/.config/celeris/workspace.toml` の `[run] mode = "container"`）のとき、**ハーネスの CLI そのもの**を
# コンテナの中で起こす（devcontainer 流）。タスクのディレクトリ（worktree・artifacts・runs）は
# **同じパス**で読み書きできるようにマウントし、`dir` のリポジトリは実体を同じパスで、ハーネスの
# 認証情報（`CLAUDE_CONFIG_DIR` / `CODEX_HOME` / `OPENCODE_CONFIG` の指す場所）は**読み取り専用**で渡す。
# ホームや `~/.local/celeris` を丸ごと見せることはしない。
#   runtime           — "auto"（既定。podman → docker の順に `info` を試す）/ "podman" / "docker"。
#                       起動時に 1 度だけ調べ、結果は `GET /api/v1/daemon` の `containers` とログに出る。
#                       **どれも使えなければ `run = container` のタスクは dispatch されず `blocked`** になり、
#                       「コンテナ runtime が使えません…」という質問が人に積まれる（ホストでよければ
#                       そのリポジトリの `run` を `host` にする）。
#   image_default     — `workspace.toml` に `[container] image` も `dockerfile` も無いときのイメージ。
#                       既定 "celeris-worker:latest"（`scripts/containers/build-worker.sh` で作る。
#                       中身は `deploy/containers/celeris-worker/Dockerfile`）。
#   build_dir         — `[container] dockerfile` からビルドしたイメージの作業場所。既定は
#                       `~/.local/celeris/containers`（ADR-0042 D3）。タグは Dockerfile の内容と
#                       `.config/celeris/` の中身の sha（`celeris-ws-<sha12>`）なので、同じ内容なら再ビルドしない。
#                       ビルドは `<runtime> build --network host`（run と同じネットワーク。入れ子の
#                       コンテナでは `RUN` がブリッジを張れず落ちるため）。
#   build_timeout_secs— 1 回のビルドの上限（既定 1800）。超えたらタスクを `blocked` にして人に聞く。
# **`paperqa` / `local-deep-research` のタスクは常にホスト**（道具立てがホストの venv にあるため）。
# デバイス（InfiniBand など）が要る案件は、そもそもリポジトリの `run` を `host` にすること。
[containers]
# runtime = "auto"
# image_default = "celeris-worker:latest"
# build_dir = "~/.local/celeris/containers"
# build_timeout_secs = 1800

# 知識ベース（ADR-0047 D1 / D2、Phase 61）。**正本は root の下の Markdown**（DB でも外部サービスでもない）。
#
#   root           — 正本の置き場（既定 "~/.local/share/celeris/knowledge"）。**celeris は作らない**。
#                    人が 1 回だけ `celerisctl knowledge init` で用意する（リポジトリ化 + 骨組み + 雛形 + 索引）。
#                    無ければ GUI の「知識」は `initialized: false`、前置きの索引は空（エラーにはしない）。
#   default_mounts — 実効 profile（ADR-0046 D1）の `knowledge` が何も言わないときに全ノードが継ぐマウント。
#                    `kb:<scope>` / `repo:<name>[:<docs>]` / `dir:<path>` / `memory[:<node>]`。
#                    案件のタスクにはこれに加えて `projects/<案件 slug>` が自動で付く。
#                    綴りを間違えると起動時に設定エラー（黙って無視しない）。
#
# ワーカーは `celerisctl knowledge search|get|record` で読み書きする（HTTP は使わない）。コンテナ実行では
# root を同じパスに読み取り専用で、`_inbox` だけ書き込み可でマウントする（ADR-0043 D3 / ADR-0047 D3）。
[knowledge]
# root = "~/.local/share/celeris/knowledge"
# default_mounts = ["kb:user", "kb:environment"]

# 知識の自動メンテナンス（ADR-0047 D4、Phase 62）。**既定は無効**。終端になったタスクから
# LangMem（`tools/langmem/`。`scripts/knowledge/setup-langmem.sh` が venv を作る）で知識の候補を
# 抽出し、`confidence = high` の `create`/`update` は知識ベースへ直接コミット、それ以外は
# `_inbox/` へ（人が GUI で accept/reject）。LLM 呼び出しはこの python プロセスの中だけで起き、
# celeris 本体（tick・ディスパッチャ・ストア）はいつ起こすか・どう適用するかを決定的に決めるだけ。
#
#   enabled            — true にすると tick が知識整理 run を起こすようになる。
#   provider            — "openai-compatible"（既定。ローカルの Qwen OpenAI 互換エンドポイントもこちら）
#                          | "anthropic"。
#   base_url            — "openai-compatible" のときの接続先（例: 本番の Qwen トンネル
#                          "http://127.0.0.1:18000/v1"）。
#   model               — 例 "qwen3.8-27b"。
#   api_key_secret      — `[secrets] dir` の下の id。省略すると渡さない（ローカルの OpenAI 互換
#                          エンドポイントは鍵を確認しないことが多い）。
#   max_related_pages   — 依頼文に入れる関連ページの上限（既定 10）。
#
# ADR-0052 D1（Phase 64）: 知識整理タスクを起こす直前に `GET <base_url>/models` を 3 秒で当て、届かなければ
# 下の `[[harnesses]] id = "knowledge"` の `fallback` に従って tier cheap の汎用ハーネスに倒す（60 秒キャッシュ）。
[knowledge.langmem]
# enabled = false
# ADR-0053 D2（Phase 65）: [llm_proxy] を有効にしたら、直接 Qwen を指すのではなくプロキシに向ける
# （Qwen が落ちていれば celeris/cheap が自動で Claude/GPT のアカウントプールに倒れる。ADR-0052 の
# フォールバックはプロキシの中に吸収される）。
# provider = "openai-compatible"
# base_url = "http://127.0.0.1:18100/v1"
# model = "celeris/cheap"
# max_related_pages = 10

# ---------------------------------------------------------------------------
# LLM source のローカル OpenAI 互換プロキシ（ADR-0053 D1/D2、Phase 65）。**既定は無効**
# （どの source も設定していなければ `effective_enabled() == false`）。
#
# ログイン済みの Claude Code / Codex の資格情報（`[accounts] claude_dir` / `codex_dir`。
# config/celeris.multi-account.example.toml を参照）を使って、opencode・PaperQA・Local Deep
# Research・LangMem のような「adapter を選ばない」ハーネスから Claude / GPT / Qwen を
# OpenAI 互換 API 越しに使えるようにする。ハーネス側は `celeris/<tier>`（供給元はプロキシが選ぶ）、
# `claude/<tier>` / `gpt/<tier>` / `qwen/<tier>`（供給元を固定）、または `<source>:<具体モデル名>`
# （素通り。例 `claude:claude-sonnet-5`）のどれかをモデル名に書く。
# ---------------------------------------------------------------------------
[llm_proxy]
# enabled = true                 # 省略時は「どれかの source が設定されていれば有効」
# listen = "127.0.0.1:18100"     # 既定。loopback のみ。認証は [api] の token_file と同じ
# prefer_free = true             # celeris/<tier> は到達可能な無料の openai_compatible を最優先
# max_concurrent_per_account = 4
# cooldown_fallback_secs = 300

# [llm_proxy.sources.claude_oauth]
# accounts_dir は省略可（[accounts] claude_dir をそのまま使う）。明示すればそちらが勝つ
# accounts_dir = "~/.local/celeris/claude-accounts"
# base_url / token_url / client_id は Anthropic 側の実装が変わったときの上書き用（既定で足りるはず）

# [llm_proxy.sources.codex_oauth]
# accounts_dir = "~/.local/celeris/codex-accounts"

# 既存の Qwen トンネル（ADR-0026）をそのまま中継する source。
# [[llm_proxy.sources.openai_compatible]]
# id = "qwen"
# base_url = "http://127.0.0.1:18000/v1"

# tier → 供給元ごとの実モデル ID。既定値は `docs/llm-source.md` に注記した通り**未確認**
# （celeris.model-tiers.example.toml と同じ注意）。運用前に必ず確認・上書きする。
# [llm_proxy.models.claude]
# frontier = "claude-opus-4-5"
# standard = "claude-sonnet-5"
# cheap = "claude-haiku-4-5"
# GPT は **ChatGPT アカウントの Codex backend が受ける slug だけ**が使える（2026-09-21 実機: Codex CLI 0.155.1 のプリセット
# gpt-5.6-terra / gpt-5.6-luna / gpt-5.6-sol / gpt-5.5 / gpt-5.4 は 200。gpt-5 / gpt-5-mini / gpt-5-codex / gpt-5.x-codex は
# 「not supported when using Codex with a ChatGPT account」で 400）。CLI を上げたら `strings $(which codex) | grep '"slug"'` で確かめる。
# [llm_proxy.models.gpt]
# frontier = "gpt-5.6-terra"
# standard = "gpt-5.6-terra"
# cheap = "gpt-5.5"
# [llm_proxy.models.qwen]
# frontier = "qwen3.8-27b"
# standard = "qwen3.8-27b"
# cheap = "qwen3.8-27b"

# ---------------------------------------------------------------------------
# ADR-0054 D1（Phase 67）: ノードごとの継続セッション（`node_sessions`）。CoS の対話は全体で 1 本、
# 部門長（engineering/research/operations の根ノード）のレビュー・切り分け run（ADR-0051）は部署ごとに
# 1 本、`--resume`（claude-code）/ `codex exec resume`（codex）/ `session/load`（acp）で続ける。
# ---------------------------------------------------------------------------
[sessions]
# そのセッションの累計トークン（run の usage の合計）がこれを超えたら、次の run は新しいセッションから
# 始める（前置きに「前セッションの要約」を乗せる）。既定 400_000。
rollover_tokens = 400_000

# Check::Reviewer の判定 run に使う adapter / tier（ADR-0010 D9）。adapter 省略時は tier だけで選ぶ。
[reviewer]
# adapter = "claude-code"
tier = "standard"

# Plan kind の子タスクを親 done と同時に ready にするか（DESIGN §4.2 plan.auto_accept、ADR-0007）。
# false（既定）なら子は draft で挿入され、人間が `celerisctl approve <child-id>` で ready にする。
[plan]
auto_accept = false

# 対話が常に走るハーネス（Phase 30、ADR-0033 D4 追記 / ADR-0046 D3・D6）。
# `POST /api/v1/org/{id}/messages` で話しかけたときの run は、話しかけたノードの `genre`
# （仕事のハーネス）に関係なく、常にこのハーネスの tier・adapter・指示文で走る
# （実機の事故: 検索ハーネスのノードに話しかけたら検索ハーネスが会話しようとして落ちた）。
# 指す id は下の `[[harnesses]]` に存在すること（無ければ起動時の設定エラー）。
[conversation]
genre = "conversation"

# ADR-0049: 汎用ハーネスでは adapter を省略して Claude Code / Codex / ACP から自動選択する。
# 明示するとそのアダプタに固定する。PaperQA / LDR / LangMem は専用なので明示が必要。
# プール同士は adapter をまたいで残量を比較し、利用不能なら非プールの供給元へ進む。
# 既存設定の移行・残量取得は docs/providers.md を参照。
# ハーネス = 実行契約（ADR-0046 D3）。**今までの `[[genres]]`（能力・入出力の契約・対話用か）と
# `[[roles]]`（adapter・tier・指示文・予算）を 1 つにしたもの**。
#
#   - タスクの `genre` 列がそのまま harness id を指す（GUI とプランナーは「ハーネス」と呼ぶ）。
#   - **組織と 1 対 1 にしない**。1 つのノードが複数のハーネスを受けられるし、同じハーネスを
#     複数のノードが使う（誰が受けられるかは `config/org.example.toml` の `profile.harnesses`）。
#   - 組み込みで `conversation` / `plan` / `reviewer` / `smoke` がある。ここに同じ id を書けば上書きできる。
#   - 旧い `[[genres]]` + `[[roles]]` もそのまま読める（互換。起動時に warn が 1 行出る）。
#     `celerisctl config to-harnesses --config <this file>` で新しい形を書き出し、
#     旧い `[[genres]]` / `[[roles]]` の節を消して差し替える。
#
# `capabilities` / `input_artifacts` / `output_artifacts`（ADR-0028 D1）は 3 つとも任意の自由記述。
# 各要素は `名前` でも `名前: 説明` でもよい（`:` の前が名前。`artifact_exists` の照合には名前だけを使う）。
# ここに並ぶハーネスは `adapter` を書かずに **tier だけ**にしてある（監査 M-1）: この例の
# `[[providers]]` は `fake` なので、そのまま起動して組織・案件・対話の流れを一通り試せる。実機の
# ハーネスに切り替えるときは providers を実際の供給元へ変更する。汎用ハーネスの adapter は省略のままでよい。

[[harnesses]]
id = "conversation"
description = "人と話し、案件を理解し、組織に流す"
tier = "standard"
conversation = true
capabilities = ["案件の理解の確認", "大まかな方針の提案", "途中目標の提案と再設計"]
input_artifacts = ["人の依頼文", "下から上がった報告"]
output_artifacts = ["返事（result.json の summary）", "plan.json"]
instructions = """あなたは人の Chief of Staff。案件を受け取り、組織に流し、報告を集めて人に渡す。
修正・実装を頼まれたら、調査だけに縮めず実装・検証まで含む仕事を actions で委譲する。
承認済みの通常作業で再承認を求めず、必要な情報が欠ける場合だけ質問する。人が数十秒で読める分量にする。
人が計画を求めたときは理解・方針・途中目標を提案する。
コードの作業場所は登録済みの案件と repos をまず確認し、不明な場合だけ質問して GUI で登録してもらう。
仕事の場所は案件に持たせ、担当に ssh で
リモートの作業ツリーへ直接書かせない（編集は手元、検証はリモート）。
担当（誰がやるか）は celeris が決めるので、あなたが名指しで人を選ぶ必要はない。"""

# ADR-0052 D2（Phase 64）: 知識整理（ADR-0047 D4）。組み込みのままで動くので普段は書かなくてよい。
# `fallback` は「専用アダプタ（`langmem` = Qwen）に届かないとき、どの tier の汎用ハーネスに倒すか」。
# 組み込みの既定は `{ tier = "cheap" }`。ここで書き換えられ、`fallback = false` で倒さなくなる
# （＝ Qwen が落ちている間の知識整理 run は Phase 63 までと同じく失敗する）。
# [[harnesses]]
# id = "knowledge"
# adapter = "langmem"
# tier = "cheap"
# fallback = { tier = "cheap" }
# budget = { max_turns = 4, max_wall_secs = 900, max_retries = 1 }

[[harnesses]]
id = "plan"
description = "案件を分解し、子タスクの計画を書く"
tier = "standard"
input_artifacts = ["案件の依頼文", "途中目標"]
output_artifacts = ["plan.json"]

[[harnesses]]
id = "coding"
description = "コードを書く・直す・テストする"
tier = "standard"
capabilities = ["ソースコードの読み書き", "テストの実行", "パッチの作成"]
input_artifacts = ["issue description", "repository"]
output_artifacts = ["diff", "test results"]
budget = { max_turns = 20 }
instructions = "あなたは実装担当。受け取った範囲だけを実装し、終わったら summary を書く。"

# ADR-0046 D7: `data-analysis` と `writing` は coding と同じアダプタで、指示文が違うだけ。
[[harnesses]]
id = "data-analysis"
description = "実験の生データを整え、統計と図表にする"
tier = "standard"
capabilities = ["データの整形", "統計", "作図"]
input_artifacts = ["生データ", "測定の条件"]
output_artifacts = ["figures", "tables", "summary.md"]
budget = { max_turns = 20 }
instructions = "あなたはデータ整理担当。数値は再現手順と一緒に残し、図表の体裁を整える。"

[[harnesses]]
id = "writing"
description = "結果を framing し、論文・報告の形にする"
tier = "standard"
capabilities = ["論文の構成", "本文の執筆", "推敲"]
input_artifacts = ["結果", "図表", "関連研究"]
output_artifacts = ["draft", "summary.md"]
budget = { max_turns = 20 }
instructions = "あなたは執筆担当。主張と根拠の対応を崩さず、読者が追える順に並べ直す。"

[[harnesses]]
id = "literature"
description = "関連研究の調査・先行研究の確認・新規性の検討（PaperQA2 + arXiv / OpenAlex）"
tier = "standard"
capabilities = ["学術文献の検索と取得", "PDF 全文からの根拠抽出", "引用付きの要約"]
input_artifacts = ["question", "pdf", "bibliography"]
output_artifacts = ["answer.md: 引用付きの答え（これが答え）", "papers.json: 検索した論文の一覧（コーパス。答えではない）", "sources.json: 出典と引用の有無", "queries.json: 使った検索語"]
instructions = "あなたは精読担当。候補論文を読み込み、引用付きで要点と新規性への影響をまとめる。"

# 一般 Web の調査。論文は上の `literature` に投げる（実機の事故: 一般 Web 検索で関連研究を調べさせたら、
# レビュアーが「出典が Medium / Qiita / note のブログ」と不合格にした）。
[[harnesses]]
id = "web-research"
description = "論文化されていない GitHub 上の実装・製品・仕様・技術報告の調査（Local Deep Research）"
tier = "standard"
capabilities = ["一般 Web 検索", "複数ページの読解", "出典付きの報告"]
input_artifacts = ["question"]
output_artifacts = ["report.md: 出典付きの調査報告（これが答え）", "sources.json: 出典と引用の有無", "research.json: 検索の記録（クエリと件数）"]
instructions = "あなたは Web 調査担当。論文化されていない実装・製品・仕様を一般 Web 検索で調べ、出典付きでまとめる。"

# 旧い形（Phase 58 まで）。`[[harnesses]]` を書くならこちらは**消すこと**（両方あると `[[harnesses]]` が勝つ）。
# 互換のためだけに残してあり、`[[harnesses]]` が 1 つも無いときだけ読まれる（起動時に warn が 1 行出る）。
#
# [[roles]]
# id = "implementer"
# tier = "standard"
# max_turns = 20
# instructions = "あなたは実装担当。…"
#
# [[genres]]
# id = "coding"
# description = "コードを書く・直す・テストする"
# default_role = "implementer"
# roles = ["implementer"]

# 実行中の委譲の上限（ADR-0016 D2 / M6）。既定は下の値。超える提案は拒否され、理由が WorkerProgress に残る（run は失敗しない）。
[delegation]
max_delegate_per_run = 8   # 1 run が提案できる子の件数（複数の delegate メッセージをまたいで数える）
max_tree_depth = 5         # 木の深さ（根 = 1）
max_tree_runs = 100        # 木全体のワーカー run 数
# 委譲した子が failed になったときの親の扱い（ADR-0021）。
#   "retry_then_ask"（既定）… 親をやり直す（attempts を 1 つ使い、次の run は子の結果を見られる）。
#                              やり直せない（max_retries に達した）なら blocked にして人に質問する。親は failed にしない。
#   "ignore"              … 子の失敗を見ずに親を完了させる（ADR-0016 M5 までの挙動）。
on_child_failure = "retry_then_ask"

# 報告の圧縮（ADR-0033 D3 / SPEC §3.5）。親ノードに子の報告がたまったら、まとめの run を 1 回だけ起こす。
# 生成（run の done / error / question を 1 件の報告にすること）は決定的で、まとめる中身だけが LLM の仕事。
[reports]
compress_after = 4          # 子の報告がこの件数たまったら起こす
compress_after_secs = 7200  # 件数に満たなくても、最古の報告がこの秒数を過ぎたら起こす（2 時間）

# Discord への通知（ADR-0037 / SPEC §3.5 / §3.6）。**人の判断が要るときだけ**知らせる:
#   milestone_ready（途中目標の仕事が全部終わった）/ approval_pending（未決の認可）/
#   question_blocked（質問で止まった）/ bad_news（秘書レベルの悪い知らせ）/ secretary_reply（案件の方針の提案）。
# 判定は決定的（LLM は関与しない）。result / progress は知らせない（それは GUI の報告の流れ）。
# webhook の URL は**秘密**なので TOML には書かない: GUI の「アカウント → API キー」から
# `discord-webhook` という id で登録する（= `[secrets] dir` の下の同名ファイル）。登録が無ければ何も送らない。
[notify]
discord_webhook_secret = "discord-webhook"        # [secrets] の中の id（既定値。書かなくてよい）
interval_secs = 30                                # 判定と送信の間隔（秒）
# gui_base_url = "http://192.168.1.103:7700"      # 文面に付けるリンクの根（省略するとリンク無し）

# 昇格のライブ引き継ぎ（ADR-0040 D4、Phase 47）。新しいリリースを同じ DB・同じポート（`SO_REUSEPORT`）に
# 起こすと、新しい方が `standby` になって古い方に引き継ぎを求め、古い方は `draining` になって
# **手元の run を最後まで面倒を見てから** exit 0 する（新しい仕事は新しい方が取る）。
# `drain_timeout_secs` はその待ち時間の上限。超えたら残りの run を abort し（リースが切れて新しい
# active が従来どおり拾う）、exit 0 する。同じ `release` を二重に起こすと何もせず exit 3。
# [handoff]
# drain_timeout_secs = 3600          # 既定 3600（1 時間）

# 自己改善のデプロイ（ADR-0040 D6 / ADR-0041 D3、Phase 48/50。docs/selfdeploy.md）。
# `scripts/selfdeploy/release.sh` が作るリリースの置き場所。`GET /releases` はここの
# `manifest.json` / `gate.json` / `verify.json` / `changes.json` / `promoted.json` を読むだけ、
# `POST /releases/{sha12}/promote`（管理系）は **`<current>/scripts/promote.sh`** を detached で
# 起こす（**昇格は人が押す**。ADR-0040 D5）。
# `current` / `previous` の symlink は `releases_dir` の**親**（本番では ~/.local/celeris/current）にある。
# ADR-0045 D2: 既定は `~/.local/celeris/releases`（書けば従来どおり。相対は設定ファイルのディレクトリ基準）。
#
# `repo` は**人の作業チェックアウト**。`GET /releases` の `on_main`
# （`git -C <repo> merge-base --is-ancestor <sha> main`）の判定に使う。
# delivery_projectsを有効化した案件だけ、レビュー済みSHAをこのrepoへfast-forwardする。
# `~` は celeris の $HOME で展開する。無ければ `on_main` が null になるだけ。
# [selfdeploy]
# delivery_projects = [] # 許可した自己改善案件ID。部署レビュー合格後にmerge・release・verify（本番デプロイは人）
# releases_dir = "~/.local/celeris/releases"   # 既定
# repo = "~/workspace/agent-platform"  # 既定。on_mainと自動取り込みの対象
# ADR-0051 Phase 106追記: mergeが成功した直後、release.sh を起こす前に origin へ push する。
# 失敗してもrelease準備は止めない（1度だけ再試行し、それでも駄目なら人に `git push` を促す）。
# push = true            # 既定
# push_remote = "origin" # 既定

# HTTP API（ADR-0013、docs/gui/api.md）。listen を書いたときだけ celeris のプロセス内で動く（既定は無効）。celeris-gui はこれを使う。
# loopback 以外で listen するなら token_file が必須（中身 1 行が Bearer トークン。読めない・空なら起動時に exit 2）。
# [api]
# listen = "127.0.0.1:7710"
# token_file = "~/.config/celeris/api.token"   # 本番の置き場（既定は無い。書かなければ認証なし）
# allowed_hosts = ["celeris.lab.example"]   # Host 許可リストへの追加（localhost / 127.0.0.1 / [::1] は常に許可）

# fake アダプタ: サブプロセスとして起動するコマンド。省略時は progress + done を返す sh スクリプト。
#
# ADR-0041 D5（Phase 51）: `celeris --mode verify`（`scripts/selfdeploy/verify.sh` の検証段）は、この設定を
# そのまま読んだうえで**組み込みで** `smoke` の役割・分野・プロバイダ（すべて `adapter = "fake"`）を足し、
# `[adapters.fake].command` を既定に、`[reviewer]` を `fake` / `standard` に固定する。verify の celeris は
# `genre = "smoke"` のタスク**だけ**を dispatch するので、本番のデータのコピーに対して煙試験を 1 件流しても
# 他のタスクは 1 つも動かない。**この設定ファイルに `smoke` という id の役割・分野・プロバイダを書いても
# verify では上書きされる**（煙試験で本物の LLM を呼ぶ経路を作らせないため）。通常運転（`--mode normal`）は
# 何も足さない。詳しくは docs/selfdeploy.md の「検査 6: 煙試験」。
[adapters.fake]
# command = ["sh", "-c", "cat >/dev/null; echo '{\"type\":\"done\",\"summary\":\"ok\",\"evidence\":[]}'"]

# 知識整理 run を起こす python（ADR-0047 D4、Phase 62）。`scripts/knowledge/setup-langmem.sh` が
# `$CELERIS_STATE_DIR/tools/langmem/.venv` を作る（既定は `~/.local/celeris/tools/langmem/.venv`）。
# LLM の接続先は `[knowledge.langmem]` の方（上）。`[knowledge.langmem] enabled = true` にし、
# 下の `[[providers]]` の行を有効にして初めて知識整理 run が走る。
# [adapters.langmem]
# command = "~/.local/celeris/tools/langmem/.venv/bin/python"
# idle_timeout_secs = 300

# プロバイダ表。上から順に優先（StaticPolicy）。Phase 3 では adapter = "fake" のみ使える。
[[providers]]
id = "fake-local"
adapter = "fake"
tiers = ["frontier", "standard", "cheap"]
concurrency = 2
model = "fake"

# 知識整理 run 用のプロバイダ（ADR-0047 D4、Phase 62）。有効化するには上の `[adapters.langmem]` と
# `[knowledge.langmem]` を有効にしたうえで、このコメントを外す。
# [[providers]]
# id = "langmem-main"
# adapter = "langmem"
# tiers = ["cheap"]
# concurrency = 1

# タスク完了時とは独立する KB 内部整理。接続先は knowledge.langmem を共用。
# 全候補は既存の知識 inbox で人間 accept/reject が必要。外部調査・create 禁止。
[knowledge.gc]
enabled = false
interval_hours = 24
batch_pages = 8
max_context_chars = 24000
review_after_hours = 720
large_page_chars = 12000

# Repository Doc Gardener は Knowledge GC とは別。GUI の docs/maintenance で
# repo policy を managed に adopt した local Git repository のみ対象。
[docs_maintenance]
enabled = false
interval_hours = 168
batch_pages = 8
max_context_chars = 24000
# assignee = "software-engineering"
# adapter = "codex"
