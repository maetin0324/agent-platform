# taskd 設定の例（ADR-0005 D7）。相対パスはこのファイルのあるディレクトリ基準。
db = "../taskd.sqlite3"            # taskctl --db / TASKD_DB と同じファイルを指すこと
workspace_root = "../workspaces"   # WorkspaceSpec::Local の相対パスの基準
tick_ms = 2000
max_concurrency = 2
lease_grace_secs = 60              # ADR-0002 D7: リース ttl = max_wall_secs + 猶予
idle_timeout_secs = 300            # ADR-0003 D4: 無出力タイムアウト
kill_grace_secs = 10               # ADR-0003 D4: SIGTERM 後 SIGKILL までの猶予
review_timeout_secs = 600          # Command チェック 1 件あたりの上限
error_cooldown_secs = 300          # AuthFailed / Exhausted / 起動失敗時のプロバイダ除外時間
retry_backoff_base_secs = 10       # ADR-0010 D6: リトライ前の待ち min(base·2^(attempts-1), max)。0 で無効
retry_backoff_max_secs = 300
max_requeues = 5                   # ADR-0011: 同じ試行での連続 requeue（供給側失敗）の上限。超えたら attempts を消費する

# 組織図の種（ADR-0033 D1、SPEC §3.2）。指したファイルの `[[org]]` を、**DB の `org_nodes` が空のときだけ**
# 蒔く。以後の編集は GUI（`POST/PATCH/DELETE /api/v1/org`）から行い、この設定は再読込されない。
# 書かなければ種を蒔かない（組織を使わない従来どおりの運用）。
# `config/org.example.toml` をこのファイルと同じディレクトリに `org.toml` として置けば、下の
# `[[genres]]`（coding / literature）とそのまま噛み合う（監査 M-1。分野の不整合は起動時に弾かれる）。
# org_include = "org.toml"

# 組織のノードごとの長期記憶（ADR-0033 D6、SPEC §3.2「各ノードは長期記憶を持つ」「記憶は案件をまたぐ」）。
# `<dir>/<node_id>/notes.md`（案件をまたぐ記憶）と `<dir>/<node_id>/projects/<project_id>.md`（案件の引き出し）。
# run の前にそれぞれ 8,000 字まで前置きし、run の後に結果ファイル（`<artifacts_dir>/result.json`。
# 共有 workspace のタスクでは `.taskd/artifacts/<task_id>/result.json`。ADR-0036）の `memory` を
# `- <日付>: <一行>` の形で追記する。相対パスはこのファイル基準。書かなければ記憶を読まないし書かない。
# ディレクトリは 0700 で作る（人の好みや相談の中身が入るため）。
[memory]
dir = "../memory"

# ローカルの作業場所をタスクごとの git worktree にする（ADR-0041 D1、Phase 49）。
# 案件の `workspace` が `{"kind":"local","path":"…","mode":"worktree"}`（`mode` の既定が `"worktree"`）で
# `path` が git リポジトリなら、taskd は run ごとに
#   git -C <path> worktree add -b <worktree_branch_prefix><task_id> <workspace_root>/<task_id>/tree <base>
# を切り、そこをワーカーのカレントディレクトリにする（`runs/` と `artifacts/` は作業ツリーの外）。
# base は `main`（無ければ `HEAD`）。本番の `current` リリースの sha が `main` の子孫ならその sha
# （`[selfdeploy] releases_dir` の親の `current/manifest.json` を読む）。
# taskd はコミットしないしブランチも消さない。終端で `git status --porcelain` が空なら worktree だけ消す。
# 案件の `workspace` に `"mode": "shared"` と書けば従来どおり `path` をそのまま作業ディレクトリにする。
# 接頭辞の既定はクラスタ側（ADR-0019 の `[[clusters]] sync = "worktree"`）と同じ `taskd/`。
[workspace]
# worktree_branch_prefix = "taskd/"

# Check::Reviewer の判定 run に使う adapter / tier（ADR-0010 D9）。adapter 省略時は tier だけで選ぶ。
[reviewer]
# adapter = "claude-code"
tier = "standard"

# Plan kind の子タスクを親 done と同時に ready にするか（DESIGN §4.2 plan.auto_accept、ADR-0007）。
# false（既定）なら子は draft で挿入され、人間が `taskctl approve <child-id>` で ready にする。
[plan]
auto_accept = false

# 対話が常に走る分野（Phase 30、ADR-0033 D4 追記）。`POST /api/v1/org/{id}/messages` で話しかけたときの
# run は、話しかけたノードの `genre`（仕事のハーネス）に関係なく、常にこの分野の役割・tier・adapter で走る
# （実機の事故: 検索ハーネス genre のノードに話しかけたら検索ハーネスが会話しようとして落ちた。検索ハーネスや
# PaperQA は会話ができない）。省略すればこの例と同じ既定（`secretary`）になる。指す id は下の
# `[[genres]]` に存在すること（無ければ起動時の設定エラー「対話用の分野が無い」）。
# [conversation]
# genre = "secretary"

# 役割（ADR-0016 D1）。タスクの `role` がここの `id` を指すと、省略された tier / adapter / 予算がこの既定で埋まり
# （タスクの値 > 役割の既定 > 全体の既定）、run のプロンプトに `instructions` が `## Role` として前置きされる。
# 役割名は自由記述なので、ここに無い名前をタスクに付けてもよい（既定も指示文も無いだけ）。
# `taskctl add --role lead --config <このファイル>` / API の `POST /tasks` の `"role"` で指定する。
#
# ここに並ぶ役割は `adapter` を書かずに **tier だけ**にしてある（Phase 27 / 監査 M-1）: この例の
# `[[providers]]` は `fake` なので、そのまま起動して組織・案件・対話の流れを一通り試せる。実機の
# ハーネスに切り替えるときは、役割ごとに `adapter = "claude-code"` などを足す。
[[roles]]
id = "lead"
tier = "frontier"
max_turns = 40
max_wall_secs = 1800
instructions = "あなたは取りまとめ役。実装は delegate で部下に任せ、自分は分割とレビューに集中する。"

[[roles]]
id = "implementer"
tier = "standard"
max_turns = 20
instructions = "あなたは実装担当。受け取った範囲だけを実装し、終わったら summary を書く。"

# 対話用の役割（ADR-0033 D4）。組織のノードに話しかけたときの run はこの役割で走る（そのノードが自分の
# 分野を持っていれば、そちらの `default_role` が使われる）。秘書の返事の作法をここに書く。
[[roles]]
id = "secretary"
tier = "standard"
instructions = """あなたは人の秘書。案件を受け取り、組織に流し、報告を集めて人に渡す。部をまたぐ連携はあなたが認める。
案件の依頼を受けたら、返事に (a) 案件の理解の確認 (b) 大まかな方針 (c) 最初の途中目標の提案 を必ず含め、
分からないことは質問する。長々と書かず、人が数十秒で読める分量にする。
コードを扱う案件なら、最初の返事で必ず「作業場所（どのリポジトリか。手元のパスか、どのクラスタのどのパスか）」を聞く。
決まったら人に GUI で案件の作業場所として登録してもらう（ADR-0039）。仕事の場所は案件に持たせ、担当に ssh で
リモートの作業ツリーへ直接書かせない（編集は手元、検証はリモート）。"""

# 調査分野の役割（ADR-0027）。役割名は自由記述で、下の [[genres]] roles に含めれば分野に属する。
[[roles]]
id = "literature-scout"
tier = "cheap"
instructions = "あなたは調査担当。広く候補論文を探し、見落としが無いか洗い出す（深読みはしない）。"

[[roles]]
id = "literature-reader"
tier = "standard"
instructions = "あなたは精読担当。候補論文を読み込み、引用付きで要点と新規性への影響をまとめる。"

# Web 調査（ADR-0029 / ADR-0035 §1）。人間の決定（2026-09-18）で、学術文献（PaperQA2）と一般 Web（LDR）は
# 別の課に分けた。実際に LDR を使う設定は `config/taskd.web-research.example.toml` にある。
[[roles]]
id = "web-researcher"
tier = "standard"
instructions = "あなたは Web 調査担当。論文化されていない実装・製品・仕様を一般 Web 検索で調べ、出典付きでまとめる。"

# 分野（ADR-0027 D1）。タスクの `genre` がここの `id` を指すと、role が省略されたときの既定として
# `default_role` の役割（tier / adapter / 予算）が使われ（タスクの値 > 役割の既定 > 分野の既定 > 親の値）、
# 委譲できる run（lead など）のプロンプトに「使える専門家」として一覧が渡る。分野そのものにはアダプタを持たせない
# （D2: `default_role` の役割が持つ。同じ分野でも役割ごとに違うハーネス・モデルを使い分けられる）。
# `default_role` と `roles` の各要素は上の [[roles]] に存在すること、`default_role`（あれば）は `roles` に
# 含まれることを起動時に検証する（`taskctl add --genre <id> --config <このファイル>` / API の `POST /tasks` の
# `"genre"` で指定する）。
# `capabilities` / `input_artifacts` / `output_artifacts`（ADR-0028 D1）は 3 つとも任意の自由記述。
# 各要素は `名前` でも `名前: 説明` でもよい（Phase 38。`:` の前が名前。計画・レビュアーのプロンプトには
# 説明も出るが、名前の照合（`artifact_exists`）には `:` の前だけを使う）。
# taskd は中身を検査しない（Planner・委譲できる run のプロンプトに「できること」「渡すもの→返るもの」として出るだけ）。
#
# 対話用の分野（ADR-0033 D4、Phase 30 で解決を変更）。`POST /api/v1/org/{id}/messages` で話しかけたときの
# run は、話しかけた**ノードの `genre`（仕事のハーネス）に関係なく、常にこの分野**で走る
# （下の `[conversation]` が指す。省略時の既定はこの id = `secretary`）。実機の事故: 関連研究調査課
# （`genre = web-research` = Local Deep Research）に話しかけたら検索ハーネスが会話しようとして
# 証拠ゲートで落ちた。検索ハーネスや PaperQA は会話ができないため、対話は常にこの分野に固定する。
[[genres]]
id = "secretary"
description = "人と話し、案件を理解し、組織に流す"
capabilities = ["案件の理解の確認", "大まかな方針の提案", "途中目標の提案と再設計", "組織への割り当て"]
input_artifacts = ["人の依頼文", "下から上がった報告"]
output_artifacts = ["返事（result.json の summary）", "plan.json"]
default_role = "secretary"
roles = ["secretary"]

# `config/org.example.toml` の課が使う分野（監査 M-1: 例の設定 2 つを組み合わせてそのまま起動できる）。
[[genres]]
id = "coding"
description = "コードを書く・直す・テストする"
capabilities = ["ソースコードの読み書き", "テストの実行", "パッチの作成"]
input_artifacts = ["issue description", "repository"]
output_artifacts = ["diff", "test results"]
default_role = "implementer"
roles = ["lead", "implementer"]

[[genres]]
id = "literature"
description = "関連研究の調査・先行研究の確認・新規性の検討（PaperQA2 + arXiv / OpenAlex）"
capabilities = ["学術文献の検索と取得", "PDF 全文からの根拠抽出", "引用付きの要約"]
input_artifacts = ["question", "pdf", "bibliography"]
output_artifacts = ["answer.md: 引用付きの答え（これが答え）", "papers.json: 検索した論文の一覧（コーパス。答えではない）", "sources.json: 出典と引用の有無", "queries.json: 使った検索語"]
default_role = "literature-reader"
roles = ["literature-scout", "literature-reader"]

# 一般 Web の調査（`config/org.example.toml` の Web 調査課が使う分野）。論文は上の `literature` に投げる。
[[genres]]
id = "web-research"
description = "論文化されていない GitHub 上の実装・製品・仕様・技術報告の調査（Local Deep Research）"
capabilities = ["一般 Web 検索", "複数ページの読解", "出典付きの報告"]
input_artifacts = ["question"]
output_artifacts = ["report.md: 出典付きの調査報告（これが答え）", "sources.json: 出典と引用の有無", "research.json: 検索の記録（クエリと件数）"]
default_role = "web-researcher"
roles = ["web-researcher"]

# 実行中の委譲の上限（ADR-0016 D2 / M6）。既定は下の値。超える提案は拒否され、理由が WorkerProgress に残る（run は失敗しない）。
[delegation]
max_delegate_per_run = 8   # 1 run が提案できる子の件数（複数の delegate メッセージをまたいで数える）
max_tree_depth = 5         # 木の深さ（根 = 1）
max_tree_runs = 100        # 木全体のワーカー run 数
# 委譲した子が failed になったときの親の扱い（ADR-0021）。
#   "retry_then_ask"（既定）… 親をやり直す（attempts を 1 つ使い、次の run は子の結果を見られる）。
#                              やり直せない（max_retries に達した）なら blocked にして人に質問する。親は failed にしない。
#   "ignore"              … 子の失敗を見ずに親を完了させる（ADR-0016 M5 までの挙動）。
on_child_failure = "retry_then_ask"

# 報告の圧縮（ADR-0033 D3 / SPEC §3.5）。親ノードに子の報告がたまったら、まとめの run を 1 回だけ起こす。
# 生成（run の done / error / question を 1 件の報告にすること）は決定的で、まとめる中身だけが LLM の仕事。
[reports]
compress_after = 4          # 子の報告がこの件数たまったら起こす
compress_after_secs = 7200  # 件数に満たなくても、最古の報告がこの秒数を過ぎたら起こす（2 時間）

# Discord への通知（ADR-0037 / SPEC §3.5 / §3.6）。**人の判断が要るときだけ**知らせる:
#   milestone_ready（途中目標の仕事が全部終わった）/ approval_pending（未決の認可）/
#   question_blocked（質問で止まった）/ bad_news（秘書レベルの悪い知らせ）/ secretary_reply（案件の方針の提案）。
# 判定は決定的（LLM は関与しない）。result / progress は知らせない（それは GUI の報告の流れ）。
# webhook の URL は**秘密**なので TOML には書かない: GUI の「アカウント → API キー」から
# `discord-webhook` という id で登録する（= `[secrets] dir` の下の同名ファイル）。登録が無ければ何も送らない。
[notify]
discord_webhook_secret = "discord-webhook"        # [secrets] の中の id（既定値。書かなくてよい）
interval_secs = 30                                # 判定と送信の間隔（秒）
# gui_base_url = "http://192.168.1.103:7700"      # 文面に付けるリンクの根（省略するとリンク無し）

# 昇格のライブ引き継ぎ（ADR-0040 D4、Phase 47）。新しいリリースを同じ DB・同じポート（`SO_REUSEPORT`）に
# 起こすと、新しい方が `standby` になって古い方に引き継ぎを求め、古い方は `draining` になって
# **手元の run を最後まで面倒を見てから** exit 0 する（新しい仕事は新しい方が取る）。
# `drain_timeout_secs` はその待ち時間の上限。超えたら残りの run を abort し（リースが切れて新しい
# active が従来どおり拾う）、exit 0 する。同じ `release` を二重に起こすと何もせず exit 3。
# [handoff]
# drain_timeout_secs = 3600          # 既定 3600（1 時間）

# 自己改善のデプロイ（ADR-0040 D6、Phase 48。docs/selfdeploy.md）。
# `scripts/selfdeploy/release.sh` が作るリリースの置き場所。`GET /releases` はここの
# `manifest.json` / `gate.json` / `verify.json` を読むだけ、`POST /releases/{sha12}/promote`（管理系）は
# `<releases_dir>/<sha12>/scripts/promote.sh` を detached で起こす（**昇格は人が押す**。ADR-0040 D5）。
# `current` / `previous` の symlink は `releases_dir` の**親**（本番では ~/taskd/current）にある。
# 相対パスは設定ファイルのディレクトリ基準。既定が "releases" なので、~/taskd/taskd.toml なら
# 何も書かなくても ~/taskd/releases を見る。
# [selfdeploy]
# releases_dir = "releases"          # 既定 "releases"

# HTTP API（ADR-0013、docs/gui/api.md）。listen を書いたときだけ taskd のプロセス内で動く（既定は無効）。taskd-gui はこれを使う。
# loopback 以外で listen するなら token_file が必須（中身 1 行が Bearer トークン。読めない・空なら起動時に exit 2）。
# [api]
# listen = "127.0.0.1:7710"
# token_file = "secrets/api.token"
# allowed_hosts = ["taskd.lab.example"]   # Host 許可リストへの追加（localhost / 127.0.0.1 / [::1] は常に許可）

# fake アダプタ: サブプロセスとして起動するコマンド。省略時は progress + done を返す sh スクリプト。
[adapters.fake]
# command = ["sh", "-c", "cat >/dev/null; echo '{\"type\":\"done\",\"summary\":\"ok\",\"evidence\":[]}'"]

# プロバイダ表。上から順に優先（StaticPolicy）。Phase 3 では adapter = "fake" のみ使える。
[[providers]]
id = "fake-local"
adapter = "fake"
tiers = ["frontier", "standard", "cheap"]
concurrency = 2
model = "fake"
