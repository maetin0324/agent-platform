# 分野（ADR-0027）を使った、関連研究調査（PaperQA2）とコーディングを両方載せる設定例。相対パスはこの
# ファイルのあるディレクトリ基準。コピーして書き換えて使うこと（`celerisctl ... --config <このファイルのコピー>`）。
#
# 前提:
#   - `uv` の隔離環境などに paper-qa（`paperqa` パッケージ）を入れておく（例
#     `~/.local/celeris/paperqa/.venv`）。ADR-0063 Phase 109d C1/C2: このアダプタはもう `pqa` CLI を
#     呼ばない。埋め込みの python ランナー（`paperqa_ask.py`）が `paperqa` の Python API
#     （`from paperqa import Settings, ask`）を直接呼ぶので、下の `command` は **venv の `python`**
#     （例 `~/.local/celeris/paperqa/.venv/bin/python`）を指す。旧 `pqa` を指していても自動で同じ
#     ディレクトリの `python` に置き換えて 1 回警告するが、設定は直しておくこと。
#   - PaperQA の設定ファイル（下の `settings` が指す `.json`、ここでは
#     config/paperqa.qwen-local.example.json をコピーして書き換えたもの）に **必ず**:
#       - `agent.agent_type = "fake"`（既定の ToolSelector はこの版の組み合わせで落ちる。ADR-0027 の実機確認）
#       - `embedding = "sparse"`（鍵無しの埋め込み。Semantic Scholar は鍵無しだと 429 なので使わない）
#       - `llm_config` / `summary_llm_config` / `agent.agent_llm_config` の `timeout` を伸ばす（既定 60 秒だと
#         ローカル Qwen のような遅い LLM で 1 要約が 180 秒かかって落ちる。ここでは 900 秒にしてある）
#       - `parsing.multimodal = false`（ADR-0035 の実機確認。既定は PDF の画像を取り出して**既定モデル
#         `gpt-4o-2024-11-20`** で説明文を作るため、ローカル LLM のエンドポイントでは 404 になり
#         **PDF の索引作成が丸ごと落ちる**）
#       - `llm_config`/`summary_llm_config`/`agent.agent_llm_config` の `litellm_params.num_retries`
#         を 3 にしておく（ADR-0063 Phase 109b A4。実機の失敗: 昇格直後の llm-proxy が一瞬すべての
#         候補を失って 503 `no_source_available` を返し、`pqa` の要約呼び出しがそのまま失敗していた。
#         litellm がその 503/502/429 を指数バックオフで再試行するようになる。
#         config/paperqa.qwen-local.example.json は既にこの値）
#     を設定しておくこと。
#   - PDF を索引するには venv に `pillow` も必要（`uv pip install pillow`。pypdf の画像抽出が要求する）。
#   - `settings` にはファイルパスから **`.json` を付けずに** 渡す（`Settings.from_name` と同じ実機の
#     仕様。`paperqa_ask.py` がこのパスを `PQA_SETTINGS_DIR`（親ディレクトリ）とファイル名に分ける）。
#   - 論文（`paper_directory`）と索引（`index_directory`）の下に、**案件ごと**（タスクの `project_id`、
#     案件が無ければ `_shared`）のサブディレクトリを celeris 側が作る（ADR-0035 D1 / D2。同じ案件の別タスク・
#     リトライで corpus と索引を使い回すため）。**著者版 PDF を人が直接置きたいときは、この
#     `<paper_directory>/<project_id>/` に置けば、次の run から PaperQA の索引（`agent.index` はこの
#     ディレクトリ全体を見る）に入り、`pqa ask` / `ask()` が使える**（ADR-0063 Phase 109g B）。
#   - ADR-0063 Phase 109g B: 知識ベース（`[knowledge]`）に `primary-sources` タグを付けたページの
#     `sources`（`celerisctl knowledge record --source` で人が付けた DOI/arXiv/PDF の URL）も、
#     目的文中の URL と同じく毎 run 必ず acquire の seed 候補に入る（既知の論文を種にする）。
#   - ADR-0035: run は 2 段（取得 → 回答）。1 段目は arXiv / OpenAlex（**鍵なし**）で候補論文を探し、
#     open access の PDF を案件の corpus に落とす（`[adapters.paperqa.acquire]`）。2 段目は ADR-0063
#     Phase 109d C1: 埋め込みの python ランナー（`paperqa_ask.py`）が `paperqa` の Python API を呼ぶ
#     （目的文から対象が取れていれば対象ごと + 総括の複数回、上限 `max_asks`。取れなければ単一の問い）。
#     取得と引用の件数は決定的な証拠ゲート（`[adapters.paperqa.evidence]`）が見る。
#     成果物は `artifacts/answer.md`（対象が取れていれば対象別の表 + 節、末尾に「引用された文献
#     （contexts）」と `## 出典`）と、同じ内容の `artifacts/report.md`（ADR-0063 Phase 109b A3: 調査系
#     タスクの受け入れ条件 `artifact_exists report.md` を LDR と揃えるため。CoS の指示文では
#     `report.md` を標準として使う）/ `papers.json` / `sources.json` / `queries.json` / `research.json`。
#   - ADR-0035 D5（Phase 36）: その 1 段目の**検索語は LLM が立てる**（`acquire.query_llm`、既定 true）。
#     PaperQA2 と同じ LLM 先に `chat/completions` を 1 回叩くだけなので、`env` の `OPENAI_BASE_URL` が
#     生きていることが前提。壊れた答えなら決定的な抽出に落ちるので、止まりはしない。

db = "../celeris-research-demo.sqlite3"
workspace_root = "../workspaces"
tick_ms = 2000
max_concurrency = 2
lease_grace_secs = 60
idle_timeout_secs = 300
kill_grace_secs = 10
review_timeout_secs = 600
error_cooldown_secs = 300

[plan]
auto_accept = false

# `[adapters.paperqa]` は共通設定（ADR-0027 D3）。`settings`/`env`/`model` は `[[providers]] adapter =
# "paperqa"` の行ごとに上書きできる（`acp`/`command`/`args` と同じ作り。ADR-0026 D2）。
[adapters.paperqa]
# ADR-0063 Phase 109d C2: `pqa` CLI ではなく venv の python（`paperqa_ask.py` を起動する）。
command = "/home/u/celeris/paperqa/.venv/bin/python"
# `.json` を付けない（実機の仕様）。config/paperqa.qwen-local.example.json をコピーして書き換えたものを指す。
settings = "/home/u/celeris/paperqa/settings/qwen-local"
paper_directory = "/home/u/celeris/paperqa/papers"
index_directory = "/home/u/celeris/paperqa/index"
# ADR-0063 Phase 109d C3 / Phase 109h: 対象ごとの問い + 総括の問いの上限（既定 10。比較先があるときは
# 総括の問いを必ず残し、対象側を後ろから詰める。目的文の対象がそれでも多ければ、詰めた対象は
# `research.json`/`report.md` に「max_asks の制限で問えなかった」対象として残る）。
# max_asks = 10
# LiteLLM 経由で OpenAI 互換の口に向ける。ADR-0053 D2（Phase 65）: celeris の LLM source プロキシ
# （`[llm_proxy]`。既定 `127.0.0.1:18100`）に向ける。Qwen が落ちていれば celeris/standard は自動で
# Claude/GPT のアカウントプールに倒れる（下の `model` も参照）。`OPENAI_API_KEY` は**プロキシの Bearer**
# （`[api] token_file` の中身と同じ値。ダミーでは通らない — 直接 Qwen を叩いていた頃と違う点）。
# `RES_OPTIONS` は、このホストで見つかった glibc の A/AAAA 並行送信の取りこぼし対策（ADR-0031 の実機記録。
# 取得ランナーの名前解決が 5 秒待たされる症状が出たら効く）。
# ADR-0063 D4（Phase 109。実機の事故: `acquire_input.json` に `OPENAI_API_KEY` の値が平文で残っていた
# — run ディレクトリはワーカー/レビュアーが読める）: ここに書いた値はプロセス環境変数としてのみ渡り、
# アダプタは `acquire_input.json` にこの値を書かない（プレースホルダだけ）。
env = { OPENAI_API_KEY = "<[api] token_file と同じ値>", OPENAI_BASE_URL = "http://127.0.0.1:18100/v1", RES_OPTIONS = "single-request" }

# 文献の取得（ADR-0035 D1）。鍵は要らない（arXiv と OpenAlex のどちらも公開 API）。
[adapters.paperqa.acquire]
# ランナーを動かす python。省略すると上の `command` と同じディレクトリの `python3`（= venv の中）。
# 標準ライブラリしか使わないので、LDR 用の venv などを指してもよい。
# command = "/home/u/celeris/paperqa/.venv/bin/python3"
# 重複排除（DOI / arXiv id / タイトル）後に残す候補の上限。**0 にすると取得の段そのものを行わない**
# （手元の corpus だけで答える従来の使い方。このとき下の `evidence` も見ない）。
max_candidates = 30
# 1 run で corpus に入れる PDF の上限。**ローカル LLM で索引を作ると 1 本あたり数分かかる**ので、
# Qwen をトンネル越しに使う構成では 3〜6 本程度から始めるとよい（索引は案件ごとに使い回される）。
max_pdfs = 12
# 検索語 1 本・エンジン 1 つあたりの取得件数（arXiv の `max_results` / OpenAlex の `per_page`）。
per_query = 20
timeout_secs = 30
# OpenAlex の polite pool 用の連絡先。鍵ではないが、入れておくと制限が緩い。
# mailto = "you@example.org"

# ADR-0035 D5（Phase 36。実機の失敗から）: **検索語は LLM が立てる**。日本語の依頼文から英語の
# 学術検索語・arXiv のカテゴリ・除外語を 1 回の `chat/completions` で出させる（PaperQA2 と同じ LLM 先。
# 上の `env` の `OPENAI_BASE_URL` に直接叩く。別の run は立てない）。答えが JSON として使えなければ
# 決定的な抽出（依頼文の ASCII 名詞句）に落ち、その理由が `artifacts/queries.json` と progress に残る。
# `false` にすると常に決定的な抽出だけを使う（Phase 34 までの挙動）。
query_llm = true
# 検索語を立てるモデル。省略すると `[[providers]] model`（`--llm`）→ 上の `settings` の `llm` の順。
# LiteLLM の `provider/` 接頭辞は落として渡す（`openai/qwen3.8-27b` → `qwen3.8-27b`）。
# query_model = "qwen3.8-27b"
# その 1 回の呼び出しのタイムアウト（秒）。ローカル LLM は遅いので余裕を持たせる。
query_timeout_secs = 300
# OpenAlex の `filter=`。省略すると `is_oa:true,primary_topic.field.id:17`
# （open access かつ Computer Science。fields/17 は実機の `GET https://api.openalex.org/fields` で確認）。
# 計算機科学以外の分野を調べるときだけ書き換える（例: Engineering は 22）。
# openalex_filter = "is_oa:true,primary_topic.field.id:22"

# ADR-0063 D1（Phase 109。実機の失敗から）: 本文（PDF）が 403 等で取れない候補は、OpenAlex / arXiv /
# Unpaywall / Semantic Scholar のメタデータにある abstract で妥協する（`<key>_abstract.txt` として
# corpus に入れる。本文でないことを明記する注記付き）。既定 true。PDF が無い候補を corpus に入れたく
# なければ false（Phase 108 までの挙動）。
abstract_fallback = true

# 決定的な証拠ゲート（ADR-0035 D3。ADR-0031 D2 の literature 版）。`0` を書けばその項目は見ない。
# 取得が 0 件のときは「検索経路の問題かもしれない」という別のメッセージになり、`insufficient_is_error`
# に関わらず常に hard error（`Error{retryable}`）。成果物（answer.md / papers.json / sources.json /
# queries.json / research.json）は残る。
[adapters.paperqa.evidence]
min_candidates = 5
min_pdfs = 3
min_cited = 2
# ADR-0063 D1（Phase 109。実機の失敗: CHFS/UnifyFS/Mochi/BeeOND が ACM/eScholarship で 403 になり
# 本文が取れず、周辺の arXiv 論文しか corpus に入らなかった案件）: `min_cited` 等の閾値未達を hard
# error にするか。既定 false（証拠不足でも `Done` にし、`research.json` の `evidence` と
# `answer.md` の「証拠の質」節に本文/アブストの内訳と代替案を書いて reviewer / 受け入れ条件に委ねる）。
# `true` にすると Phase 108 までどおり `Error{retryable}`。
insufficient_is_error = false

[[providers]]
id = "paperqa-qwen"
adapter = "paperqa"
tiers = ["standard"]
concurrency = 1
# 空でなければ `--llm` に渡す（PaperQA の設定ファイルの llm より優先。ADR-0027 D3）。空なら設定ファイルの値のまま。
# ADR-0053 D2（Phase 65）: `celeris/standard`（LiteLLM の `openai/` 接頭辞は落として渡るので、
# プロキシが受け取るのは `celeris/standard`。供給元はプロキシが決定的に選ぶ）。
model = "openai/celeris/standard"

[[providers]]
id = "local-fake"
adapter = "fake"
tiers = ["standard", "cheap"]
concurrency = 2

# コーディング分野の役割（ADR-0016）。
[[roles]]
id = "lead"
tier = "standard"
max_turns = 20
instructions = "あなたはリード。作業を分割し、コーディングと調査それぞれに合う分野・役割へ delegate する。"

[[roles]]
id = "implementer"
tier = "cheap"
instructions = "あなたは実装担当。受け取った範囲だけを実装し、終わったら summary を書く。"

# 関連研究調査の役割（ADR-0027）。役割名は自由記述で、下の [[genres]] の roles に含めれば分野に属する。
[[roles]]
id = "literature-scout"
adapter = "paperqa"
tier = "cheap"
instructions = "広く候補論文を探し、見落としが無いか洗い出す（深読みはしない）。"

[[roles]]
id = "literature-reader"
adapter = "paperqa"
tier = "standard"
instructions = "候補論文を読み込み、引用付きで要点と新規性への影響をまとめる。"

[[roles]]
id = "novelty-skeptic"
adapter = "paperqa"
tier = "standard"
instructions = "「本当に新規か」を疑う側に立ち、近い先行研究が無いか反証を試みる。"

# 分野（ADR-0027 D1）。タスクの `genre` がここの `id` を指すと、role が省略されたときの既定として
# `default_role` の役割（tier / adapter / 予算）が使われる（タスクの値 > 役割の既定 > 分野の既定 > 親の値）。
# 分野そのものにはアダプタを持たせない（D2: `default_role` の役割が持つ。同じ分野でも役割ごとに違う
# ハーネス・モデルを使い分けられる）。`capabilities` / `input_artifacts` / `output_artifacts`
# （ADR-0028 D1）は 3 つとも任意の自由記述で、celeris は中身を検査しない。各要素は `名前: 説明` の形も書ける
# （Phase 38。`:` の前が名前。ハーネスで動く分野では、この名前が計画の `artifact_exists` に使える名前の全て）。
# Planner とワーカーに「その分野は何ができるか」「何を渡せば何が返るか」を機械可読な形で伝えるためのラベル。
[[genres]]
id = "coding"
description = "コードを書く・直す・テストする"
capabilities = ["ソースコードの読み書き", "テストの実行", "パッチの作成"]
input_artifacts = ["issue description", "repository"]
output_artifacts = ["diff", "test results"]
default_role = "implementer"
roles = ["lead", "implementer"]

# 人間の決定（2026-09-18、ADR-0035 §1）: **学術論文はこの分野（PaperQA2 + arXiv / OpenAlex）**、
# 論文化されていない GitHub 上の実装や一般 Web は `web-research` 分野（Local Deep Research。
# `config/celeris.web-research.example.toml`）。一般 Web 検索で関連研究を調べさせたら、レビュアーが
# 「出典が Medium / Qiita / note のブログ」と不合格にしたため分けた。
[[genres]]
id = "literature"
description = "関連研究の調査・先行研究の確認・新規性の検討（PaperQA2 + arXiv / OpenAlex。論文だけを見る）"
capabilities = ["学術文献の検索と取得（arXiv / OpenAlex）", "PDF 全文からの根拠抽出", "引用付きの要約"]
input_artifacts = ["question", "pdf", "bibliography"]
output_artifacts = ["report.md: 引用付きの答え（これが答え。answer.md と同じ内容。ADR-0063 Phase 109b A3）", "answer.md: report.md と同じ内容（PaperQA 固有の名前）", "papers.json: 検索した論文の一覧（コーパス。答えではない）", "sources.json: 出典と引用の有無", "queries.json: 使った検索語"]
default_role = "literature-reader"
roles = ["literature-scout", "literature-reader", "novelty-skeptic"]

[delegation]
max_delegate_per_run = 8
max_tree_depth = 5
max_tree_runs = 100
on_child_failure = "retry_then_ask"
