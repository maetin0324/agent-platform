# 組織図の種（ADR-0033 D1 / ADR-0046 D1・D6・D7、SPEC §3.2）。`config.toml` の `org_include = "org.toml"`
# が指すファイル。
#
# **このファイルは DB の `org_nodes` が空のときにだけ読まれる**。一度蒔いたら以後は DB が正で、
# 役職を足す・分ける・消すのは GUI（`POST/PATCH/DELETE /api/v1/org`）から行う。ここを書き換えても
# 既にある組織は変わらない（ADR-0024 の accounts と同じ「DB が正」の扱い）。
# 既に Phase 58 までの木が入っている DB は `celerisctl org migrate-v2 --config <config.toml>` で写す。
#
# ADR-0046 の考え方:
#   - 木が継がせるのは**文化・知識・権限・既定値**（`profile`）。能力は**タグ**（`skills`）。
#   - 「組織にする」判定は機械的: そのノード以下に共通で継がせたい knowledge / harness / tools /
#     policy / 実行環境 / 権限 / 品質基準のどれかがあるときだけ。「役割が違う」だけなら skill。
#   - ハーネス（`[[harnesses]]`）は**組織と 1 対 1 にしない**。1 つのノードが複数を受けられる。
#   - 担当は**決定的に**決まる（ADR-0046 D5 の matching）。LLM が組織図を読んで人選する経路は無い。
#
# 各行の意味:
#   id        英小文字ケバブ。API と GUI で使う不変の名前。
#   name      人が読む役職名。
#   kind      secretary（根 = Chief of Staff。1 つだけ）/ department / section。
#   parent_id 根以外は必須。
#   genre     そのノードが**自分の仕事で使う**ハーネス（`[[harnesses]] id`）。`profile.harnesses.default`
#             と同じ値を書いておくと、対話 run の前置きに「仕事で使う道具」として出る（Phase 30）。
#   brief     担当の一言。run のプロンプトに前置きされる。
#   profile   ADR-0046 D1。子は親を継ぐ（和・子勝ち・deny 勝ち・交わり・連結）。
#             skills / knowledge / harnesses / tools / deny_tools / run / model / policy / review / permissions。
#   position  同じ親の中での並び順（省略したらこのファイルの並び順）。

# ---- 根: Chief of Staff（ADR-0046 D6）----
[[org]]
id = "cos"
name = "Chief of Staff"
kind = "secretary"
genre = "conversation"
brief = """人と話し、案件を理解し、組織に流し、報告を集めて人に返す。
案件の依頼を受けたら、返事に (a) 案件の理解の確認 (b) 大まかな方針 (c) 最初の途中目標の提案 を必ず含め、
分からないことは質問する。担当は celeris が決めるので、あなたが名指しで人を選ぶ必要はない。"""

[org.profile]
tools = []
policy = ["人に返す文は、人が数十秒で読める分量にする。"]

[org.profile.harnesses]
allowed = ["conversation", "plan"]
default = "conversation"

[org.profile.model]
tier = "standard"

# CoS が読む知識（ADR-0047）: 人のことと、案件のこと。
[[org.profile.knowledge]]
kind = "kb"
scope = "user"

[[org.profile.knowledge]]
kind = "kb"
scope = "projects"

[[org.profile.knowledge]]
kind = "memory"

