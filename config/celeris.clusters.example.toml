# クラスタでコマンドを実行する設定の例（ADR-0018、Phase 12。認証方式は ADR-0032）。
# 相対パスはこのファイルのあるディレクトリ基準。
#
# 前提:
#   - ワーカー（claude-code / codex）は **このホストで動く**。クラスタで実行するのは「コマンド」だけ。
#   - クラスタへの ssh は多重接続（ControlMaster）を借りて行う。張り方は `[[clusters]].auth` で決める
#     （ADR-0032 D1）:
#       manual    … 既定。人が `scripts/cluster-login.sh <host>` か GUI の「接続」で先に張る（ADR-0018 D2 のまま）。
#       publickey … 鍵だけで入れるホスト。celeris（ディスパッチャ）が自分で接続を張ってよい（ADR-0032 D3）。
#       totp      … publickey の後に検証コード（TOTP 等）が要る。GUI の「接続」ボタンから中継する（ADR-0032 D4）。
#     いずれも ssh のオプションはいじらない（`~/.ssh/config` が正。ADR-0018 D7）。
#   - ~/.ssh/config に ControlMaster の設定が要る（config/ssh-config.example）。
#
# タスクの作り方:
#   celerisctl add --title "benchfs のベンチ" --objective "..." \
#     --cluster pegasus --workspace /work/NBB/rmaeda/workspace/rust/benchfs \
#     --check-cmd "cargo test --release"
#   → クラスタ側の /work/.../benchfs が正で、celeris は workspaces/<task_id> に写しを作る。
#     run の前に pull、ワーカーが写しを編集、判定の前に push、`--check-cmd` はクラスタで実行される。
#
# 同期の選び方（ADR-0019 D4）:
#   worktree … 既定の選択。git 管理下のプロジェクト。クラスタ側に `git worktree` を切り、その中だけを同期する。
#              追跡ファイルしか checkout されないので、未追跡の巨大データ（benchfs は 263 GB のうち 220 GB が未追跡）を
#              持ち込まない。元のリポジトリの作業ツリーには一切触らない。変更はブランチ celeris/<task_id> の作業ツリーに残り、
#              commit / merge / 後片付け（git worktree remove）は人が行う。
#   rsync   … git 管理外の小さなディレクトリ、celeris 専用の作業ディレクトリ。
#   none    … 手元とクラスタでファイルシステムが共有されている場合。
#
# 動作確認と観測（Phase 12 第 2 段階）:
#   celerisctl --db ../celeris.sqlite3 worker run --config config.toml --task <id> --cluster pegasus
#     → デーモン無しで 1 回 run（pull → run → push）。DB は変えない。多重接続が無ければ exit 4。
#   curl -s http://127.0.0.1:7710/api/v1/clusters     → 接続の有無（connected）と cooldown
#   curl -s http://127.0.0.1:7710/api/v1/inbox        → attention[] の type = "cluster_unavailable"（ログインし直しの案内）

db = "../celeris.sqlite3"
workspace_root = "../workspaces"
tick_ms = 2000
max_concurrency = 2

[api]
listen = "127.0.0.1:7710"

[adapters.claude_code]
permission_mode = "bypassPermissions"

[[providers]]
id = "claude-default"
adapter = "claude-code"
tiers = ["frontier", "standard", "cheap"]
concurrency = 2
model = "claude-sonnet-5"

[[clusters]]
id = "pegasus"
host = "pegasus"                  # ~/.ssh/config の Host 名
concurrency = 2                   # このクラスタで同時に走らせる run の上限
sync = "worktree"                 # git 管理下なら worktree（ADR-0019）。管理外なら "rsync"、共有 FS なら "none"
delete_on_push = false            # 既定 false。既存プロジェクトのファイルを消さない
# work_dir = "/work/NBB/rmaeda"   # ADR-0059 D6: 省略・相対パスの `WorkspaceSpec::Remote.path` はここから
#                                  # 解決する（HPC では `~` を作業に使わないのが普通なので既定にしない）。
#                                  # GUI の `PUT /clusters/{id}/settings` からも上書きできる（DB が勝つ）。
# ADR-0032 §1 実機確認: pegasus は既存の ControlMaster が生きていて未確認だが、人間の申告どおり sirius と
# 同じ扱い（publickey の後に keyboard-interactive = TOTP が来る）にする。
auth = "totp"                     # GUI の「接続」→ 検証コードの入力で張る（ADR-0032 D4）
# keepalive_secs = 30             # ADR-0062 A（Phase 107）: master の argv に -o ServerAliveInterval=30
#                                  # -o ServerAliveCountMax=3 -o TCPKeepAlive=yes を足す（既定 30 秒、0 で
#                                  # 無効）。sirius のように ~/.ssh/config が ServerAliveInterval 0 のホストで、
#                                  # NAT / ファイアウォールの idle timeout により TCP が黙って死ぬ事故を防ぐ。
#                                  # コマンドラインの -o は ~/.ssh/config より優先されるので人の設定は変えない。
# liveness_probe_secs = 300       # ADR-0062 A: master 越しの実通信（ssh -o BatchMode=yes <host> -- true）
#                                  # による生存確認の間隔（既定 300 秒、0 で無効）。`-O check` は unix ソケット
#                                  # を見るだけなので、NAT の idle timeout で接続が死んでいても「Master
#                                  # running」を返し続ける。実通信で確定させ、失敗したら ssh -O exit で
#                                  # 片付けてから再ログイン待ちにする。
# master_launcher = "auto"        # ADR-0060: 既定 "auto"（systemd-run が PATH にあり XDG_RUNTIME_DIR が
#                                  # 設定されていれば "systemd-run" を使う。celeris@.service の環境ならそう
#                                  # なる）。ssh の ControlMaster を celeris の unit の cgroup の外（一時
#                                  # scope）で起こし、昇格（停止→起動・ライブ切替）で master を切らない。
#                                  # 明示するなら "systemd-run"（強制）か "inline"（従来どおり celeris の
#                                  # 直接の子。cgroup の中に留まる）。
# worktree_root = "/work/NBB/rmaeda/.celeris-worktrees"  # 既定は <project>/.celeris-worktrees
# worktree_base = "HEAD"          # 切り出す元。"origin/main" なども指定できる
# worktree_paths = ["src", "Cargo.toml", "lib/pluvio/src"]
#   ↑ sparse-checkout で残すパス。追跡ファイルにも巨大なものがある場合に使う
#     （benchfs は追跡 41 GB のうち 39 GB がベンチ結果。src だけなら 2.2 MB）。
# remove_worktree_when = "never"  # 既定 "never"。celeris は worktree を消さない（実行結果を失わないため）
# setup = ["module load python/3.12"]
# env = { OMP_NUM_THREADS = "8" }
# rsync_excludes = ["target/"]    # .celeris/ runs/ inputs/ は常に除外

[[clusters]]
id = "sirius"
host = "sirius"
concurrency = 2
sync = "worktree"
delete_on_push = false
# ADR-0032 §1 実機確認（`ssh -v -o BatchMode=yes sirius`）: `Authenticated using "publickey" with partial
# success` の後に `keyboard-interactive`（TOTP）が要求される。2 段構えなので "totp"。
auth = "totp"

[[clusters]]
id = "fern03"
host = "fern03"
concurrency = 1
sync = "rsync"                    # クラスタでないノードでの実験用。git 管理外の作業ディレクトリを想定
delete_on_push = false
# ADR-0032 §1 実機確認（`ssh -v -o BatchMode=yes fern03`）: `Authenticated to fern03.omni.hpcc.jp ... using
# "publickey"` の 1 段で完了。TOTP は無い。2 要素認証が要らないので celeris（ディスパッチャ）が自分で
# 接続を張ってよい（ADR-0032 D3）。GUI の「接続」ボタンを押すだけで（コード入力なしに）張れる。
auth = "publickey"

# 2 要素認証が要らない・または人手で張り続ける運用のクラスタは、`auth` を書かなければ既定の "manual" になる
# （celeris は接続を張らない。ADR-0018 D2 のまま。人が `scripts/cluster-login.sh <host>` か GUI の従来案内で張る）。
# [[clusters]]
# id = "legacy"
# host = "legacy"
# auth = "manual"                 # 明示してもよいが、省略しても同じ既定になる
