# 分野（ADR-0027）を使った、関連研究調査（PaperQA2）とコーディングを両方載せる設定例。相対パスはこの
# ファイルのあるディレクトリ基準。コピーして書き換えて使うこと（`taskctl ... --config <このファイルのコピー>`）。
#
# 前提:
#   - `uv` の隔離環境などに paper-qa（`pqa` CLI）を入れておく（例 `~/taskd/paperqa/.venv/bin/pqa`）。
#   - PaperQA の設定ファイル（下の `settings` が指す `.json`、ここでは
#     config/paperqa.qwen-local.example.json をコピーして書き換えたもの）に **必ず**:
#       - `agent.agent_type = "fake"`（既定の ToolSelector はこの版の組み合わせで落ちる。ADR-0027 の実機確認）
#       - `embedding = "sparse"`（鍵無しの埋め込み。Semantic Scholar は鍵無しだと 429 なので使わない）
#       - `llm_config` / `summary_llm_config` / `agent.agent_llm_config` の `timeout` を伸ばす（既定 60 秒だと
#         ローカル Qwen のような遅い LLM で 1 要約が 180 秒かかって落ちる。ここでは 900 秒にしてある）
#       - `parsing.multimodal = false`（ADR-0035 の実機確認。既定は PDF の画像を取り出して**既定モデル
#         `gpt-4o-2024-11-20`** で説明文を作るため、ローカル LLM のエンドポイントでは 404 になり
#         **PDF の索引作成が丸ごと落ちる**）
#     を設定しておくこと。
#   - PDF を索引するには venv に `pillow` も必要（`uv pip install pillow`。pypdf の画像抽出が要求する）。
#   - `settings` にはファイルパスから **`.json` を付けずに** 渡す（`pqa` 自身が拡張子を足す実機の仕様）。
#   - 論文（`paper_directory`）と索引（`index_directory`）の下に、**案件ごと**（タスクの `project_id`、
#     案件が無ければ `_shared`）のサブディレクトリを taskd 側が作る（ADR-0035 D1 / D2。同じ案件の別タスク・
#     リトライで corpus と索引を使い回すため）。
#   - ADR-0035: run は 2 段（取得 → 回答）。1 段目は arXiv / OpenAlex（**鍵なし**）で候補論文を探し、
#     open access の PDF を案件の corpus に落とす（`[adapters.paperqa.acquire]`）。2 段目が `pqa ask`。
#     取得と引用の件数は決定的な証拠ゲート（`[adapters.paperqa.evidence]`）が見る。
#     成果物は `artifacts/answer.md`（末尾に `## 出典`）/ `candidates.json` / `sources.json`。

db = "../taskd-research-demo.sqlite3"
workspace_root = "../workspaces"
tick_ms = 2000
max_concurrency = 2
lease_grace_secs = 60
idle_timeout_secs = 300
kill_grace_secs = 10
review_timeout_secs = 600
error_cooldown_secs = 300

[plan]
auto_accept = false

# `[adapters.paperqa]` は共通設定（ADR-0027 D3）。`settings`/`env`/`model` は `[[providers]] adapter =
# "paperqa"` の行ごとに上書きできる（`acp`/`command`/`args` と同じ作り。ADR-0026 D2）。
[adapters.paperqa]
command = "/home/u/taskd/paperqa/.venv/bin/pqa"
# `.json` を付けない（実機の仕様）。config/paperqa.qwen-local.example.json をコピーして書き換えたものを指す。
settings = "/home/u/taskd/paperqa/settings/qwen-local"
paper_directory = "/home/u/taskd/paperqa/papers"
index_directory = "/home/u/taskd/paperqa/index"
# LiteLLM 経由で OpenAI 互換の口（ローカル Qwen へのトンネル等）に向ける。`api_key` は使われないダミーでよい。
# `RES_OPTIONS` は、このホストで見つかった glibc の A/AAAA 並行送信の取りこぼし対策（ADR-0031 の実機記録。
# 取得ランナーの名前解決が 5 秒待たされる症状が出たら効く）。
env = { OPENAI_API_KEY = "unused", OPENAI_BASE_URL = "http://127.0.0.1:18000/v1", RES_OPTIONS = "single-request" }

# 文献の取得（ADR-0035 D1）。鍵は要らない（arXiv と OpenAlex のどちらも公開 API）。
[adapters.paperqa.acquire]
# ランナーを動かす python。省略すると上の `command` と同じディレクトリの `python3`（= venv の中）。
# 標準ライブラリしか使わないので、LDR 用の venv などを指してもよい。
# command = "/home/u/taskd/paperqa/.venv/bin/python3"
# 重複排除（DOI / arXiv id / タイトル）後に残す候補の上限。**0 にすると取得の段そのものを行わない**
# （手元の corpus だけで答える従来の使い方。このとき下の `evidence` も見ない）。
max_candidates = 30
# 1 run で corpus に入れる PDF の上限。**ローカル LLM で索引を作ると 1 本あたり数分かかる**ので、
# Qwen をトンネル越しに使う構成では 3〜6 本程度から始めるとよい（索引は案件ごとに使い回される）。
max_pdfs = 12
# 検索語 1 本・エンジン 1 つあたりの取得件数（arXiv の `max_results` / OpenAlex の `per_page`）。
per_query = 20
timeout_secs = 30
# OpenAlex の polite pool 用の連絡先。鍵ではないが、入れておくと制限が緩い。
# mailto = "you@example.org"

# 決定的な証拠ゲート（ADR-0035 D3。ADR-0031 D2 の literature 版）。満たさないと `Error{retryable}` になり、
# 成果物（answer.md / candidates.json / sources.json）は残る。`0` を書けばその項目は見ない。
# 取得が 0 件のときは「検索経路の問題かもしれない」という別のメッセージになる。
[adapters.paperqa.evidence]
min_candidates = 5
min_pdfs = 3
min_cited = 2

[[providers]]
id = "paperqa-qwen"
adapter = "paperqa"
tiers = ["standard"]
concurrency = 1
# 空でなければ `--llm` に渡す（PaperQA の設定ファイルの llm より優先。ADR-0027 D3）。空なら設定ファイルの値のまま。
model = "openai/qwen3.8-27b"

[[providers]]
id = "local-fake"
adapter = "fake"
tiers = ["standard", "cheap"]
concurrency = 2

# コーディング分野の役割（ADR-0016）。
[[roles]]
id = "lead"
tier = "standard"
max_turns = 20
instructions = "あなたはリード。作業を分割し、コーディングと調査それぞれに合う分野・役割へ delegate する。"

[[roles]]
id = "implementer"
tier = "cheap"
instructions = "あなたは実装担当。受け取った範囲だけを実装し、終わったら summary を書く。"

# 関連研究調査の役割（ADR-0027）。役割名は自由記述で、下の [[genres]] の roles に含めれば分野に属する。
[[roles]]
id = "literature-scout"
adapter = "paperqa"
tier = "cheap"
instructions = "広く候補論文を探し、見落としが無いか洗い出す（深読みはしない）。"

[[roles]]
id = "literature-reader"
adapter = "paperqa"
tier = "standard"
instructions = "候補論文を読み込み、引用付きで要点と新規性への影響をまとめる。"

[[roles]]
id = "novelty-skeptic"
adapter = "paperqa"
tier = "standard"
instructions = "「本当に新規か」を疑う側に立ち、近い先行研究が無いか反証を試みる。"

# 分野（ADR-0027 D1）。タスクの `genre` がここの `id` を指すと、role が省略されたときの既定として
# `default_role` の役割（tier / adapter / 予算）が使われる（タスクの値 > 役割の既定 > 分野の既定 > 親の値）。
# 分野そのものにはアダプタを持たせない（D2: `default_role` の役割が持つ。同じ分野でも役割ごとに違う
# ハーネス・モデルを使い分けられる）。`capabilities` / `input_artifacts` / `output_artifacts`
# （ADR-0028 D1）は 3 つとも任意の自由記述で、taskd は中身を検査しない。Planner とワーカーに
# 「その分野は何ができるか」「何を渡せば何が返るか」を機械可読な形で伝えるためのラベル。
[[genres]]
id = "coding"
description = "コードを書く・直す・テストする"
capabilities = ["ソースコードの読み書き", "テストの実行", "パッチの作成"]
input_artifacts = ["issue description", "repository"]
output_artifacts = ["diff", "test results"]
default_role = "implementer"
roles = ["lead", "implementer"]

# 人間の決定（2026-09-18、ADR-0035 §1）: **学術論文はこの分野（PaperQA2 + arXiv / OpenAlex）**、
# 論文化されていない GitHub 上の実装や一般 Web は `web-research` 分野（Local Deep Research。
# `config/taskd.web-research.example.toml`）。一般 Web 検索で関連研究を調べさせたら、レビュアーが
# 「出典が Medium / Qiita / note のブログ」と不合格にしたため分けた。
[[genres]]
id = "literature"
description = "関連研究の調査・先行研究の確認・新規性の検討（PaperQA2 + arXiv / OpenAlex。論文だけを見る）"
capabilities = ["学術文献の検索と取得（arXiv / OpenAlex）", "PDF 全文からの根拠抽出", "引用付きの要約"]
input_artifacts = ["question", "pdf", "bibliography"]
output_artifacts = ["answer.md", "candidates.json", "sources.json"]
default_role = "literature-reader"
roles = ["literature-scout", "literature-reader", "novelty-skeptic"]

[delegation]
max_delegate_per_run = 8
max_tree_depth = 5
max_tree_runs = 100
on_child_failure = "retry_then_ask"
