[package]
name = "taskctl"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "taskctl"
path = "src/main.rs"

[dependencies]
task-core = { path = "../task-core" }
task-worker = { path = "../task-worker" }
task-dispatch = { path = "../task-dispatch" }
taskd = { path = "../taskd" }
clap = { version = "4", features = ["derive"] }
time = { version = "0.3", features = ["formatting"] }
thiserror = "2"
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "signal"] }

[dev-dependencies]
tempfile = "3"
