[package]
name = "task-worker"
version = "0.1.0"
edition.workspace = true

[dependencies]
task-core = { path = "../task-core" }
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "rt-multi-thread", "fs"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
tracing = "0.1"
sha2 = "0.10"
nix = { version = "0.30", features = ["signal", "process"] }
time = { version = "0.3", features = ["serde", "formatting"] }

[dev-dependencies]
tempfile = "3"
