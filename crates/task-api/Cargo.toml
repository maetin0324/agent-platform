[package]
name = "task-api"
version = "0.1.0"
edition.workspace = true

[dependencies]
task-core = { path = "../task-core" }
task-ops = { path = "../task-ops" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1.53.1", features = ["sync", "time", "net", "rt", "macros", "fs", "io-util"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
form_urlencoded = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
toml = "0.9"
tracing = "0.1"
ulid = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-util", "net", "time"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
