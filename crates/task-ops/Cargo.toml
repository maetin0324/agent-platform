[package]
name = "task-ops"
version = "0.1.0"
edition.workspace = true

[dependencies]
task-core = { path = "../task-core" }
time = { version = "0.3", features = ["formatting"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
schemars = "1"
serde_json = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[dev-dependencies]
tempfile = "3"
