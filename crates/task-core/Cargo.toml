[package]
name = "task-core"
version = "0.1.0"
edition.workspace = true

[dependencies]
ulid = { version = "1", features = ["serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
# ADR-0043 D4（Phase 52）: リポジトリの中の設定 `.config/celeris/workspace.toml` を読む。
toml = "0.9"

[dev-dependencies]
tempfile = "3"
