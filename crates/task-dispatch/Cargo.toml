[package]
name = "task-dispatch"
version = "0.1.0"
edition.workspace = true

[dependencies]
task-core = { path = "../task-core" }
task-worker = { path = "../task-worker" }
tokio = { version = "1", features = ["time", "sync", "macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
time = "0.3"
ulid = "1"

[dev-dependencies]
tempfile = "3"
async-trait = "0.1"
