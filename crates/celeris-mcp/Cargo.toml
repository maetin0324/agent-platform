[package]
name = "celeris-mcp"
version = "0.1.0"
edition.workspace = true

[dependencies]
task-core = { path = "../task-core" }
task-ops = { path = "../task-ops" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "1", features = ["sync", "time", "net", "rt", "macros", "io-util"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "charset", "http2", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tracing = "0.1"
ulid = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "time"] }
