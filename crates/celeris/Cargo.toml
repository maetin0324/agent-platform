[package]
name = "celeris"
version = "0.1.0"
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "celeris"
path = "src/main.rs"

[dependencies]
task-core = { path = "../task-core" }
task-worker = { path = "../task-worker" }
task-dispatch = { path = "../task-dispatch" }
task-ops = { path = "../task-ops" }
task-api = { path = "../task-api" }
llm-proxy = { path = "../llm-proxy" }
async-trait = "0.1"
time = { version = "0.3", features = ["formatting"] }
ulid = "1"
# ADR-0040 D4（Phase 47）: API の listener を `SO_REUSEPORT` で bind する（新旧が同じポートに並ぶ）。
socket2 = { version = "0.5", features = ["all"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "charset", "http2"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
time = { version = "0.3", features = ["serde", "formatting"] }
